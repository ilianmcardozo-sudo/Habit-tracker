<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F12">
<meta name="description" content="Tus hábitos del día, con tu amigo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<title>Ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column (max 440px). Scoreboard + sticker identity:
   expanded heavy numerals, a 100 % bar split into habit colors, tiles that fill with their color when done, stamps on perfect days. */
:root{
  --bg:#0D0F12;
  --surface:#16191E;
  --surface-2:#1F232A;
  --line:#2B3038;
  --fg:#F3F3EF;
  --muted:#8C929B;
  --faint:#4E555F;
  --accent:#34D399;
  --ember:#FFC24B;
  --ink:#101114;
  --display:'Archivo', 'Arial Black', ui-sans-serif, system-ui, sans-serif;
  --body:'Onest', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-inline:16px;
  padding-block:0;
  min-height:100%;
}
button{touch-action:manipulation;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.num{font-family:var(--display);font-stretch:125%;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{max-width:440px;margin:0 auto;padding-block:16px 130px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px}
.view[hidden]{display:none!important}
.flame-fill{fill:url(#flameG)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-l{min-width:0}
.eyebrow{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:34px;line-height:1;letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance}
.top-r{display:flex;gap:8px;align-items:center;flex:none}
.streak-chip{display:flex;align-items:center;gap:3px;height:42px;padding:0 13px 0 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:19px}
.streak-chip svg{width:24px;height:24px}
.streak-chip.cold svg path{fill:var(--faint)}
.avatar-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--fg);display:grid;place-items:center;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:18px}
.avatar-btn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2.2}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:14px;border:1.5px solid transparent}
.day .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:13px;color:var(--muted);background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0);position:relative}
.day .dot::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.day .dot span{position:relative}
.day.full .dot{background:var(--accent);color:var(--ink)}
.day.full .dot::before{display:none}
.day.rest .dot{background:none;border:2px dotted var(--faint)}
.day.rest .dot::before{display:none}
.day.sel{border-color:var(--line);background:var(--surface)}
.day.sel .wd{color:var(--fg)}
.day.today .wd{color:var(--accent)}

.lockbar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.lockbar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.lockbar span{flex:1}
.lockbar button{background:var(--fg);color:var(--ink);font-weight:700;padding:8px 14px;border-radius:12px;white-space:nowrap;font-size:13px}

/* Score hero */
.score{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;border-radius:26px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.score-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:84px;line-height:.8}
.big small{font-size:34px;color:var(--muted);margin-left:2px;font-weight:800}
.score-side{text-align:right;display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.score-side b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:15px}
.score-side span{font-size:13px;color:var(--muted)}
.bar100{display:flex;gap:4px;height:22px}
.bseg{position:relative;flex-basis:0;border-radius:7px;background:color-mix(in oklab,var(--c) 14%,var(--surface-2));overflow:hidden;min-width:8px}
.bseg i{position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bseg.on i{transform:scaleX(1)}
.bar-legend{display:flex;gap:4px;margin-top:-8px}
.stamp{position:absolute;top:14px;right:14px;transform:rotate(8deg) scale(.6);opacity:0;padding:6px 10px;border:2.5px solid var(--accent);border-radius:10px;color:var(--accent);font-family:var(--display);font-stretch:125%;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none}
.score.perfect .stamp{opacity:1;transform:rotate(8deg) scale(1)}
.score.perfect .score-side{visibility:hidden}
.score.pulse{animation:pulse 1.2s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 22px transparent}}

/* Friend strip on Today */
.fstrip{text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%}
.fstrip .who{font-size:13px;color:var(--muted)}
.fstrip .who b{color:var(--fg)}
.fbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.fbar span{display:block;height:100%;background:#4FB3FF;border-radius:9px}
.fstrip .v{font-size:18px}
.avatar{width:32px;height:32px;border-radius:11px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:14px;flex:none}
.avatar.f{background:#4FB3FF}

/* Banners */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line);font-size:13px;color:var(--muted)}
.banner button{color:var(--fg);font-weight:700;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.banner.warn button{color:#FF8A7A}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:13.5px}
.tip p{margin:0;flex:1}
.tip button{color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}

/* Sections & tiles */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:19px;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.tag{font-size:12.5px;color:var(--muted);font-weight:600}
.sec-note{font-size:13.5px;color:var(--muted);padding:14px;border-radius:18px;border:1.5px dashed var(--line)}
.off-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border-radius:16px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:14px}
.off-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.off-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.list{display:flex;flex-direction:column;gap:8px}
.tile{--c:var(--accent);position:relative;display:grid;grid-template-columns:1fr auto;align-items:stretch;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);transition:background .3s,border-color .3s,color .3s,transform .15s;overflow:hidden}
.tile-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;min-height:76px;min-width:0;width:100%;grid-column:1/-1}
.tile-main .txt{padding-right:46px}
.tile-note{position:absolute;top:50%;right:56px;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);z-index:1}
.tile-note svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile-note:active{background:rgba(127,127,127,.15)}
.tile.done .tile-note{color:var(--ink)}
.box{border-radius:50%!important}
.tile-main:active{transform:scale(.985)}
.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:color-mix(in oklab,var(--c) 18%,transparent);border:1.5px solid color-mix(in oklab,var(--c) 45%,transparent);flex:none;transition:background .3s,border-color .3s}
.txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.name svg{width:16px;height:16px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.share{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;color:var(--c)}
.wk{display:inline-flex;gap:3px;align-items:center}
.wk i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.7}
.wk i.on{background:currentColor;opacity:1}
.note{font-size:13px;margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.9}
.thumbs{display:flex;gap:5px;margin-top:5px}
.thumbs img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.box{width:30px;height:30px;border-radius:10px;border:2px solid color-mix(in oklab,var(--c) 60%,var(--line));display:grid;place-items:center;flex:none;align-self:center;transition:background .25s,border-color .25s}
.box svg{width:18px;height:18px;stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.tile.done .box{background:var(--ink);border-color:var(--ink)}
.tile.done .box svg{opacity:1;stroke:var(--c)}
.add-hint{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:4px;color:rgba(16,17,20,.75)}
.add-hint svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fline{display:block;font-size:12.5px;color:var(--fg);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile-side{display:grid;place-items:center;width:56px;border-left:1.5px solid var(--line);color:var(--muted);transition:border-color .3s,color .3s}
.tile-side svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile.done{background:var(--c);border-color:var(--c);color:var(--ink)}
.tile.done .ico{background:rgba(16,17,20,.12);border-color:rgba(16,17,20,.18)}
.tile.done .meta,.tile.done .share{color:rgba(16,17,20,.82)}
.tile.done .tile-side{border-color:rgba(16,17,20,.16);color:var(--ink)}
.tile.met:not(.done){opacity:.6}
.tile.past{cursor:default}
.tile.past:not(.done){opacity:.5}
.tile.past .tile-main:active{transform:none}
.tile.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.add-habit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:22px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:14.5px}
.add-habit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* Onboarding */
.empty{padding:20px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.empty h3{margin:0;font-family:var(--display);font-stretch:118%;font-weight:900;font-size:26px;line-height:1.05;text-wrap:balance}
.empty p{margin:0;color:var(--muted);font-size:14px}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sugs:empty{display:none}
.sug{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);text-align:left;animation:viewin .2s var(--ease)}
.sug .hicon{color:var(--accent)}
.sug b{font-weight:700;font-size:15px;flex:1;min-width:0}
.sug span{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.idea{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);font-size:14px;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .12s}
.idea:active{transform:scale(.96)}
.idea.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.idea .tag{font-size:12px}
.idea.on .tag{color:var(--ink)}
.ideas.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.ideas.scroll::-webkit-scrollbar{display:none}
.ideas.scroll .idea{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--fg);color:var(--ink);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:#FF8A7A;border:1.5px solid rgba(255,138,122,.35)}
.btn.wide{width:100%}

/* Registro */
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:26px;background:var(--accent);color:var(--ink);display:flex;flex-direction:column;gap:16px}
.hero.cold{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-num{font-size:104px;line-height:.78}
.hero-flame{width:70px;height:70px;flex:none}
.hero.cold .hero-flame path{fill:var(--faint)}
.hero-lbl{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:-.005em}
.hero-sub{font-size:13.5px;opacity:.85;margin-top:2px}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.hweek .wd{font-size:12px;font-weight:700;opacity:.85}
.hweek .s{width:32px;height:32px;margin:5px auto 0;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;opacity:.4}
.hweek .s svg{width:15px;height:15px;stroke:currentColor;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hweek .full .s{opacity:1;background:var(--ink);border-color:var(--ink)}
.hweek .full .s svg{stroke:var(--accent)}

.hero.cold .hweek .wd{color:var(--muted);opacity:1}
.hero.cold .hweek .full .s{background:var(--accent);border-color:var(--accent)}
.hero.cold .hweek .full .s svg{stroke:var(--ink)}
.hweek .part .s{opacity:.75}
.hweek .rest .s{border-style:dotted;opacity:.6}
.hweek .today .s{opacity:1;border-width:2.5px}
.hweek .future .s{opacity:.18}
.next{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.next b{font-weight:800}
.bar{height:10px;border-radius:99px;background:rgba(16,17,20,.16);overflow:hidden}
.hero.cold .bar{background:var(--surface-2)}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ink)}
.hero.cold .bar span{background:var(--accent)}
.badges{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:78px;padding:12px 6px 10px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.badge svg{width:26px;height:26px}
.badge b{font-size:22px;line-height:1.05}
.badge.got{border-color:var(--accent)}
.badge.locked{opacity:.38}
.badge.locked svg path{fill:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stat .v{font-size:28px;line-height:1}
.stat .v small{font-size:14px;color:var(--muted);margin-left:1px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.card{padding:16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head h3{margin:0;font-family:var(--display);font-stretch:118%;font-weight:900;font-size:17px;text-transform:uppercase}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.cal-nav button:disabled{opacity:.3;cursor:default}
.cal-nav svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.cell{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:13px;color:var(--fg);background:var(--surface-2);font-variant-numeric:tabular-nums}
.cell::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%), transparent 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 61%);mask:radial-gradient(circle,transparent 58%,#000 61%);pointer-events:none}
.cell.full::before,.cell.rest::before,.cell.future::before,.cell.blank::before{display:none}
.cell.full{background:var(--accent);color:var(--ink)}
.cell.rest{background:transparent;border:2px dotted var(--muted);color:var(--muted)}
.cell.future{background:transparent;color:var(--muted);opacity:.6;cursor:default}
.cell.blank{background:transparent;cursor:default}
.cell.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.hint{font-size:12.5px;color:var(--muted)}

/* Diario */
.feed{display:flex;flex-direction:column;gap:12px}
.entry{position:relative;padding:14px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.entry header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.e-date{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.pill{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill.full{padding:3px 8px;border:2px solid var(--accent);border-radius:8px;color:var(--accent);transform:rotate(-3deg);text-transform:uppercase;font-size:12px;letter-spacing:.05em}
.e-item{--c:var(--accent);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.e-item .ico{width:36px;height:36px;border-radius:12px;font-size:17px}
.e-item .name{font-size:14.5px}
.e-item .note{-webkit-line-clamp:unset;display:block;margin-top:2px;opacity:1}
.photos{display:grid;gap:5px;margin-top:8px;border-radius:16px;overflow:hidden}
.photos.n1{grid-template-columns:1fr}
.photos.n2{grid-template-columns:1fr 1fr}
.photos.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.photos.n3 img:first-child{grid-row:span 2;aspect-ratio:3/4}
.photos img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;display:block;cursor:zoom-in;background:var(--surface-2)}
.photos.n3 img:not(:first-child){aspect-ratio:auto;min-height:70px}
.also{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);align-items:center}
.also span.h{--c:var(--accent);padding:5px 10px;border-radius:10px;background:var(--c);color:var(--ink);font-weight:600}

/* Amigo */
.preview{font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:14px;border:1.5px dashed var(--line)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.duel .who{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;max-width:100%}
.duel .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel .n{display:flex;align-items:center;gap:2px;font-size:46px;line-height:1}
.duel .n svg{width:30px;height:30px}
.duel .vs{font-family:var(--display);font-stretch:125%;font-weight:900;color:var(--faint);font-size:15px}
.duel .lbl2{font-size:12.5px;color:var(--muted)}
.ftile{--c:var(--accent);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line)}
.ftile.done{background:var(--c);border-color:var(--c);color:var(--ink)}
.ftile.done .ico{background:rgba(16,17,20,.12);border-color:rgba(16,17,20,.18)}
.ftile.done .meta{color:rgba(16,17,20,.82)}
.ftile .note{-webkit-line-clamp:unset;display:block}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.tabs{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:20px;background:rgba(22,25,30,.86);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tab{display:flex;align-items:center;gap:7px;height:46px;padding:0 15px;border-radius:15px;color:var(--muted);font-weight:700;font-size:14px;transition:background .25s,color .25s}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--fg);color:var(--ink)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,6,8,.66);z-index:30;opacity:0;transition:opacity .25s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(440px,100%);max-height:90%;overflow:auto;z-index:31;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.drag-zone{display:flex;flex-direction:column;gap:12px;padding-top:10px;touch-action:none;cursor:grab}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .txt{flex:1}
.sh-title{font-family:var(--display);font-stretch:112%;font-weight:900;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.sh-sub{font-size:13px;color:var(--muted)}
.head-btn{height:38px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px;flex:none}
.back-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none;align-self:center}
.back-btn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.top:has(.back-btn:not([hidden])){justify-content:flex-start}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;text-align:left}
.sentinel{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.close-x{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.close-x svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2.4;fill:none;stroke-linecap:round}
.lbl{font-family:var(--display);font-stretch:112%;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:9px}
textarea,input[type=text]{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;color:var(--fg);font:inherit;font-size:16px;padding:12px 14px}
textarea:focus,input[type=text]:focus{border-color:var(--muted);outline:none}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted)}
.chip:active{transform:scale(.95)}
.shared-hint{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.shared-hint svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.done-row{--c:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px;border-radius:18px;background:var(--surface-2);border:1.5px solid var(--line);width:100%;font-weight:700;font-size:15px;transition:background .25s,color .25s}
.done-row .bx{width:30px;height:30px;border-radius:10px;border:2px solid var(--c);display:grid;place-items:center}
.done-row .bx svg{width:17px;height:17px;stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done-row.on{background:var(--c);border-color:var(--c);color:var(--ink)}
.done-row.on .bx{border-color:var(--ink);background:var(--ink)}
.done-row.on .bx svg{opacity:1;stroke:var(--c)}
.photo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-row.compact{grid-template-columns:repeat(3,64px)}
.photo-row.compact .ph{border-radius:14px}
.photo-row.compact .ph.add span{display:none}
.photo-row.compact .ph.add svg{width:22px;height:22px}
textarea.short{min-height:76px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;background:rgba(10,11,13,.78);display:grid;place-items:center}
.ph .rm svg{width:13px;height:13px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--faint);background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.ph.add svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph.busy{display:grid;place-items:center;color:var(--muted);font-size:12px}
.ro-note{font-size:15px;line-height:1.5;padding:12px 14px;border-radius:16px;background:var(--surface-2);overflow-wrap:anywhere;white-space:pre-wrap}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:14px;background:var(--surface-2);font-size:22px;display:grid;place-items:center;border:1.5px solid transparent}
.emojis button.on{border-color:var(--fg)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:38px;height:38px;border-radius:12px;background:var(--sw);box-shadow:0 0 0 2px var(--surface),0 0 0 2px transparent;transition:box-shadow .2s}
.colors button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;min-height:54px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;font-weight:700;font-size:13.5px;line-height:1.2;text-align:center}
.seg button span{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--c);color:var(--ink)}
.seg button.on span{color:var(--ink)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{display:grid;place-items:center;line-height:1;aspect-ratio:1;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:13px;color:var(--muted)}
.daypick button.on{background:var(--c);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper button{display:grid;place-items:center;line-height:1;width:46px;height:46px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:700}
.stepper button:disabled{opacity:.3}
.stepper .w{font-size:28px;min-width:28px;text-align:center}
.stepper .u{color:var(--muted);font-weight:600;font-size:14px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.link{color:var(--muted);font-weight:700;font-size:13.5px;text-align:center;padding:6px}

.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.95);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);opacity:0;pointer-events:none;z-index:40;background:var(--fg);color:var(--ink);font-weight:700;padding:6px 6px 6px 16px;min-height:48px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;display:flex;align-items:center;gap:6px;font-size:14px;max-width:calc(100% - 32px);width:max-content}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.show:not(.no-actions){pointer-events:auto}
.toast .msg{padding-right:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.toast button{padding:9px 12px;border-radius:11px;background:rgba(16,17,20,.08);font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
.toast button.strong{background:var(--ink);color:var(--fg)}
.toast.no-actions{padding-right:18px}
.toast .msg.two{display:flex;flex-direction:column;white-space:normal;padding-block:6px}
.toast .msg.two span{font-weight:500;font-size:13px;opacity:.75}
.tab{position:relative}
.tab.news::after{content:'';position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.new{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:7px;background:var(--ink);color:var(--fg);font-size:12px;font-weight:700;vertical-align:2px}
.ftile:not(.done) .new{background:var(--accent);color:var(--ink)}
.tg{display:flex;flex-direction:column;gap:10px}
.tg-row{display:grid;grid-template-columns:auto 84px 1fr auto;align-items:center;gap:10px}
.tg-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-bar{height:8px;border-radius:99px;background:rgba(16,17,20,.16);overflow:hidden}
.hero.cold .tg-bar{background:var(--surface-2)}
.tg-bar span{display:block;height:100%;border-radius:99px;background:var(--ink)}
.hero.cold .tg-bar span{background:var(--accent)}
.tg-v{font-size:14px;min-width:42px;text-align:right;display:flex;justify-content:flex-end}
.tg-v svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero.cold .avatar{background:var(--accent);color:var(--ink)}
.hero.cold .avatar.f{background:#4FB3FF}

.hero.cold .hero-flame rect{fill:var(--faint)}
.streak-chip.cold svg rect,.badge.locked svg rect{fill:var(--faint)}
/* ===== Restrained color: neutral surfaces, one accent for what matters (check, progress, streak) ===== */
[style*="--c:"]{--c:var(--accent)!important}
.ico{background:var(--surface-2);border:0}
.tile.done{background:var(--surface);border-color:color-mix(in oklab,var(--accent) 40%,var(--line));color:var(--fg)}
.tile.done .ico{background:var(--surface-2);border:0}
.tile.done .meta,.tile.done .share,.share{color:var(--muted)}
.tile.done .tile-note,.tile-note{color:var(--muted)}
.box{border:2px solid var(--muted)}
.tile.done .box{background:var(--accent);border-color:var(--accent)}
.tile.done .box svg{stroke:var(--ink)}
.bseg{background:var(--surface-2)}
.hero,.hero.cold{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.hero-sub{color:var(--muted);opacity:1}
.hero.cold .hero-flame rect,.hero.cold .hero-flame path{fill:var(--faint)}
.hweek .wd{color:var(--muted);opacity:1}
.hweek .s{border-color:var(--line);opacity:1}
.hweek .full .s,.hero.cold .hweek .full .s{background:var(--accent);border-color:var(--accent)}
.hweek .full .s svg,.hero.cold .hweek .full .s svg{stroke:var(--ink)}
.hweek .part .s{border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
.hweek .rest .s{border-color:var(--muted)}
.hweek .today .s{border-color:var(--fg)}
.hweek .future .s{opacity:.35}
.bar,.hero.cold .bar,.tg-bar,.hero.cold .tg-bar{background:var(--surface-2)}
.bar span,.hero.cold .bar span,.tg-bar span,.hero.cold .tg-bar span{background:var(--accent)}
.next{color:var(--muted)}
.next b{color:var(--fg)}
.tg-v{color:var(--fg)}
.tg-v svg{stroke:var(--accent)}
.avatar,.hero .avatar,.hero.cold .avatar{background:var(--accent);color:var(--ink)}
.avatar.f,.hero .avatar.f,.hero.cold .avatar.f{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.ftile.done{background:var(--surface);color:var(--fg);border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.ftile.done .ico{background:var(--surface-2);border:0}
.ftile.done .meta,.ftile .meta{color:var(--muted)}
.ftile:not(.done){opacity:.55}
.new,.ftile:not(.done) .new{background:var(--accent);color:var(--ink)}
.also span.h{background:var(--surface-2);color:var(--fg)}
.done-row.on{background:var(--surface-2);border-color:var(--accent);color:var(--fg)}
.done-row .bx{border-color:var(--muted)}
.done-row.on .bx{background:var(--accent);border-color:var(--accent)}
.done-row.on .bx svg{stroke:var(--ink)}
.seg button.on,.daypick button.on{background:var(--fg);color:var(--ink)}
.seg button.on span{color:var(--ink)}

.flame-core{fill:#FFE7A8}
.hero.cold .hero-flame .flame-core,.streak-chip.cold .flame-core{fill:var(--surface-2)}
.streak-chip.cold svg path.flame-fill,.hero.cold .hero-flame path.flame-fill{fill:var(--faint)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:9px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--fg);white-space:nowrap}
.fchip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.month-h{margin:10px 0 0;font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.01em}
.month-h:first-child{margin-top:0}

/* measured habits */
.amt{color:var(--fg)}
.amt b{font-weight:700}
.mbar{display:block;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:7px;max-width:200px}
.mbar i{display:block;height:100%;background:var(--c);border-radius:9px}
.box.part{border-color:transparent;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface-2) 0);-webkit-mask:radial-gradient(circle,transparent 52%,#000 55%);mask:radial-gradient(circle,transparent 52%,#000 55%)}
.box.part svg{opacity:0}
.review-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 18px;border-radius:24px;text-align:left;border:1px solid var(--line);background:radial-gradient(120% 200% at 100% 0%, color-mix(in oklab,var(--accent) 22%,transparent), transparent 60%), var(--surface)}
.review-btn b{display:block;font-family:var(--display);font-weight:500;font-size:22px}
.review-btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.amt-card{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:24px;background:radial-gradient(120% 140% at 50% 0%, color-mix(in oklab,var(--c) 24%,transparent), transparent 65%), var(--surface-2)}
.amt-ctl{display:grid;grid-template-columns:56px 1fr 56px;align-items:center}
.amt-b{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:28px;line-height:1}
.amt-b:disabled{opacity:.3}
.amt-v{display:flex;flex-direction:column;align-items:center}
.amt-v .num{font-size:64px;line-height:1;font-weight:400}
.amt-v small{color:var(--muted);font-size:14px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qchip{min-width:58px;padding:10px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px}
.qchip.on{background:color-mix(in oklab,var(--c) 35%,var(--surface));border-color:var(--c)}
.amt-goal{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.amt-goal .mbar{flex:1;margin:0;max-width:none}
.asks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.asks.n3{grid-template-columns:repeat(3,1fr)}
.asks.n5{grid-template-columns:repeat(5,1fr)}
.ask{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:18px;background:var(--surface-2);border:1.5px solid transparent;font-size:12.5px;font-weight:600;color:var(--muted)}
.ask .ae{font-size:30px;line-height:1}
.ask.on{border-color:var(--c);color:var(--fg);background:radial-gradient(100% 100% at 50% 0%, color-mix(in oklab,var(--c) 32%,transparent), transparent 75%), var(--surface-2)}
.rv-dots{display:flex;gap:5px;justify-content:center;margin-top:-6px}
.rv-dots i{width:22px;height:4px;border-radius:9px;background:var(--surface-2)}
.rv-dots i.past{background:var(--muted)}
.rv-dots i.now{background:var(--fg)}
.rv-q{margin:0;font-family:var(--display);font-size:30px;line-height:1.12;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.rv-big{font-size:88px;line-height:1}
.rv-big small{font-size:34px;color:var(--muted)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-weight:600;text-align:left}
.switch-row .sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch-row .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch-row.on .sw{background:var(--accent)}
.switch-row.on .sw::after{transform:translateX(18px)}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ===== Motion system: one ease for movement, one spring for arrivals, short durations ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--t-fast:.12s;--t-base:.25s;--t-slow:.45s}
.tile-main,.btn,.review-btn,.nav-row,.fchip,.scase,.ask,.chip,.qchip,.pick,.cell,.tab,.icon-btn,.head-btn,.close-x,.back-btn,.streak-chip,.avatar-btn,.add-habit,.tile-note{transition:transform var(--t-fast) var(--ease),background-color var(--t-base) var(--ease),border-color var(--t-base) var(--ease),color var(--t-base) var(--ease)}
.tile-main:active,.review-btn:active,.nav-row:active,.scase:active,.pick:active,.add-habit:active{transform:scale(.98)}
.btn:active,.fchip:active,.ask:active,.chip:active,.qchip:active,.cell:active,.tab:active,.head-btn:active,.close-x:active,.back-btn:active,.streak-chip:active,.avatar-btn:active,.tile-note:active{transform:scale(.94)}
.tile.pop{animation:none}
.tile.pop .box{animation:boxpop .45s var(--spring)}
@keyframes boxpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.view.enter{animation:viewin var(--t-base) var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{transition:transform .38s var(--ease)}
.toast{transition:transform .4s var(--spring),opacity .25s var(--ease)}
.prog{position:relative}
.gain{position:absolute;left:96px;top:10px;font-family:var(--display);font-stretch:118%;font-weight:900;font-size:16px;color:var(--accent);pointer-events:none;animation:gain 1s var(--ease) forwards}
@keyframes gain{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.05)}100%{opacity:0;transform:translateY(-18px) scale(1)}}

  ui.scoreIO = new IntersectionObserver(es => {
    const e = es[es.length - 1]; ui.scoreVisible = e.intersectionRatio >= .55;
    if (ui.scoreVisible) setTimeout(flushScore, 180);
  }, {threshold:[0,.55,1]});
  ui.scoreIO.observe($('score'));
}
document.addEventListener('visibilitychange', () => setTimeout(flushScore, 250));
function renderScore(){
  watchScore();
  if (!scoreSeen()) { ui.scoreDirty = true; return; }
  const k = todayKey(), list = counted(k), sm = shareMap(list,k);
  const rest = isRest(k), full = isFull(k);
  /* the climber walks up the trail with the day's total; the summit is 100 % */
  climbTo(rest ? 0 : dayPct(k));
  $('score').classList.toggle('rest', rest);
  const n = list.length, left = list.filter(h => !isDone(k,h.id)).length;
  $('scoreSide').innerHTML = !active().length ? 'Elige tus hábitos abajo'
    : rest ? 'Día libre'
    : full ? `${CHECK_SVG}Día perfecto`
    : `${left === 1 ? 'Falta 1' : `Faltan ${left}`} de ${n}`;
  if (rest) { ui.shownPct = 0; $('pct').innerHTML = '—'; }

}
/* The climber glides along the trail with a soft stride. It turns smoothly on
   each switchback, and a new target mid-walk continues from where it is. */
function placeClimber(p, stride){
  const path = $('trailDone'), L = ui.trailLen || (ui.trailLen = path.getTotalLength());
  const pt = path.getPointAtLength(L * p), ahead = path.getPointAtLength(Math.min(L, L * p + 3));
  const want = stride == null ? 1 : (ahead.x < pt.x - .2 ? -1 : 1);
  ui.climbDir = stride == null ? want : (ui.climbDir ?? 1) + (want - (ui.climbDir ?? 1)) * .18;
  ui.climbCur = p;
  path.setAttribute('stroke-dasharray', `${(p*100).toFixed(2)} 100`);
  const sw = stride == null ? 2.2 : 1.6 * Math.sin(stride);
  $('legs').setAttribute('d', `M0 -4 L${(-sw).toFixed(2)} 0 M0 -4 L${sw.toFixed(2)} 0`);
  const sx = Math.abs(ui.climbDir) < .15 ? .15 * Math.sign(ui.climbDir || 1) : ui.climbDir;
  $('climber').setAttribute('transform', `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) scale(${(1.15*sx).toFixed(3)} 1.15)`);
}
function climbTo(to){
  if (ui.climbTarget === to) return;            // already there or already walking there
  ui.climbTarget = to;
  const from = ui.climbCur ?? 0;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return placeClimber(to);
  const L = ui.trailLen || $('trailDone').getTotalLength(), dist = Math.abs(to - from) * L;
  const dur = Math.min(2600, 700 + dist * 7);
  let t0 = null;
  const step = now => {
    if (ui.climbTarget !== to) return;
    if (t0 == null) t0 = now;                    // start on a clean frame, after the list re-renders
    const x = Math.min(1,(now-t0)/dur), e = x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
    const p = from + (to-from)*e;
    placeClimber(p, x < 1 ? Math.abs(p - from) * L / 5 : null);
    if (x < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(() => requestAnimationFrame(step));
}
function animatePct(to){
  const el = $('pct'), from = ui.shownPct, t0 = performance.now(), dur = 550;
  ui.shownPct = to;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.innerHTML = `${to}<small>%</small>`; return; }
  const step = now => {
    const x = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-x,3);
    el.innerHTML = `${Math.round(from + (to-from)*e)}<small>%</small>`;
    if (x < 1 && ui.shownPct === to) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  let meta = rs.has(h.id) ? `<span class="share">${rs.get(h.id)} %</span>` : `<span>suma al hacerlo</span>`;
  let met = false;

function feedHTML(limit, who, from, inPage){
  const f0 = firstKey();

  while (k >= f0) {
    const html = entryHTML(k);
    if (html) { if (shown >= limit) { more = true; break; } shown++; out += html; }
    k = addDays(k,-1);
  }
  if (!shown) out = `<div class="sec-note">${who === 'friend' ? 'Aún no hay días anteriores.' : 'Tu diario empieza con el primer hábito que marques. Cada día queda guardado aquí con tus notas y fotos.'}</div>`;

    ? `<div class="sentinel" id="histSentinel">Cargando más días…</div>`
    : `<button class="nav-row" data-act="open-history" data-who="${who}"><span>Ver días anteriores</span>${RIGHT_SVG}</button>`;

/* ---------- together: shared streak + friend news ---------- */
function dayStatus(S, k){ return withState(S, () => k < firstKey() ? 'none' : isFull(k) ? 'full' : isRest(k) ? 'rest' : 'open'); }
/* A day counts for the shared streak only when both completed it (a rest day is neutral for that person). */
function bothDone(k){
  if (!friend) return null;
  const a = dayStatus(state,k), b = dayStatus(friend,k);
  if (a === 'none' || b === 'none') return null;
  if (a === 'rest' && b === 'rest') return 'skip';
  return (a !== 'open' && b !== 'open') ? 'yes' : 'no';
}
function sharedStreak(){
  const t = todayKey();
  let k = bothDone(t) === 'yes' ? t : addDays(t,-1), n = 0;
  for (let i = 0; i < 400; i++) {
    const r = bothDone(k);
    if (r === 'skip') { k = addDays(k,-1); continue; }
    if (r !== 'yes') break;
    n++; k = addDays(k,-1);
  }
  return n;
}
/* "News" = friend activity with a note or photo, or a completed day, since you last opened the Amigo tab. */
function friendNews(since){
  if (!friend) return 0;
  const t = todayKey(), items = [];
  withState(friend, () => {
    [t, addDays(t,-1)].forEach(k => habitsOn(k).forEach(h => {
      const e = entry(k,h.id);
      if (e && e.done && (e.at || 0) > since && (e.note || photosOf(e).length)) items.push(h.id);
    }));
    if (isFull(t) && (state.fullAt || 0) > since) items.push('full');
  });
  return items.length;
}

function newDraft(h){

  const d = ui.draft;
  d.kind = h ? kindOf(h) : 'check';
  d.amount = clone(h && h.amount) || {unit:'h', goal:8};
  d.askOn = !!(h && h.ask && d.kind !== 'ask');
  d.askSet = (h && h.ask && h.ask.set) || 'calidad';

function saveHabit(){

(function(){

        btn.classList.add('loading'); err.textContent = '';

        catch(e2) { err.textContent = authMsg(e2); btn.classList.remove('loading'); }
      };

        <h1>Revisa tu correo</h1>
        <p>Te enviamos un código a <b>${esc(email)}</b>. Si no aparece, mira en spam.</p>

        <div class="auth-links"><button class="link" id="au-back">Usar otro correo</button><button class="link" id="au-resend" disabled>Reenviar en 30 s</button></div>`);
      const inp = a.querySelector('#au-code'), btn = a.querySelector('#au-verify'), err = a.querySelector('#au-err'), rs = a.querySelector('#au-resend');
      let left = 30; const tick = setInterval(() => { left--; rs.textContent = left > 0 ? `Reenviar en ${left} s` : 'Reenviar código'; rs.disabled = left > 0; if (left <= 0) clearInterval(tick); }, 1000);
      const go = async () => {
        const code = inp.value.replace(/\D/g, '');
        if (code.length < 6) { err.textContent = 'El código tiene 6 dígitos.'; inp.focus(); return; }
        btn.classList.add('loading'); err.textContent = '';
        try { const u = await cloud.verifyCode(email, code); clearInterval(tick); buzz(12); resolve(u); }
        catch(e2) { err.textContent = authMsg(e2); btn.classList.remove('loading'); inp.select(); }
      };

}

  const cached = sync.cached();
  if (cached) { state = normalize(cached); freezePast(); render(); hideSplash(); }
  try { state = normalize(await sync.load()); }
  catch(e) {
    console.warn('[ritmo] load', e);
    if (!cached) { authScreen('<div class="auth-brand">Ritmo</div><h1>No pudimos cargar tu día</h1><p>Revisa tu conexión y vuelve a abrir la app.</p>'); return; }
  }
  await refreshFriend();
  await acceptPendingInvite();
  freezePast(); save(); render(); hideSplash();
  const poll = async () => { if (!document.hidden && await refreshFriend() && !ui.sheet) render(); };
  setInterval(poll, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); else sync.flush(); });
  window.addEventListener('online', () => sync.flush());
  window.addEventListener('pagehide', () => sync.flush());
}
await boot();
})();
</script>
</body>
</html>
