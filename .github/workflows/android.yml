# Compila la app de Android en GitHub (aquí sí hay SDK de Android).
# Resultado: un .apk para instalar en el teléfono, en la pestaña Actions → la ejecución → Artifacts.
name: Android

on:
  push:
    paths: ['index.html', 'cloud.js', 'config.js', 'vendor/**', 'icons/**', 'manifest.webmanifest',
            'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json',
            'tools/build-www.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copiar la app web a Android
        run: npm run android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Compilar el APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Revisar que el APK trae la app
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > contents.txt
          for f in assets/public/index.html assets/public/cloud.js assets/public/config.js \
                   assets/public/vendor/supabase.js assets/capacitor.config.json; do
            grep -q " $f$" contents.txt || { echo "Falta $f en el APK"; exit 1; }
          done
          # aapt2 can add a version qualifier to the folder (mipmap-xxxhdpi-v4)
          grep -Eq " res/mipmap-xxxhdpi[^/]*/ic_launcher\.(png|webp)$" contents.txt || { echo "Falta el ícono en el APK"; exit 1; }
          unzip -p "$APK" assets/public/config.js | grep -q "supabase.co" || { echo "config.js sin Supabase"; exit 1; }
          echo "APK OK: $(du -h "$APK" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: habit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
