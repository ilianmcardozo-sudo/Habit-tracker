# Compila la app de Android en GitHub (aquí sí hay SDK de Android).
# Resultado: un .apk para instalar en el teléfono, en la pestaña Actions → la ejecución → Artifacts.
name: Android

on:
  push:
    paths: ['index.html', 'cloud.js', 'config.js', 'vendor/**', 'icons/**', 'manifest.webmanifest',
            'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json',
            'tools/build-www.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copiar la app web a Android
        run: npm run android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Compilar el APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: habit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
